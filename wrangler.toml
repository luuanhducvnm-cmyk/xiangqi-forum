# Site tĩnh xiangqi.forum chạy bằng Cloudflare Workers Static Assets (miễn phí, CDN toàn cầu).
# Triển khai:  python3 build.py && npx wrangler deploy
name = "xiangqi-forum"
compatibility_date = "2025-09-01"
# Tắt địa chỉ *.workers.dev để chỉ còn xiangqi.forum được lập chỉ mục (tránh trùng nội dung).
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
not_found_handling = "404-page"   # dùng dist/404.html (đã đặt noindex)

# Gắn tên miền (domain phải đang dùng DNS của Cloudflare). Bỏ comment sau khi thêm domain vào tài khoản Cloudflare:
# routes = [{ pattern = "xiangqi.forum", custom_domain = true }]
